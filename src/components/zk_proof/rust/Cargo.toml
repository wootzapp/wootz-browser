[package]
name = "zk_proof"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
ark-bn254 = "0.5.0"
ark-groth16 = "0.5.0"
ark-ff = "0.4.0"
ark-ec = "0.4.0"
ark-std = "0.4.0"
ark-serialize = "0.4.0"
ark-relations = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cxx = "1.0"
sha2 = "0.10"
num-bigint = "0.4"
base64 = "0.13"
